<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 983 285" role="img" aria-labelledby="title detail"><title id="title">Cyber Risk Assessment &amp; GRC component flow</title><desc id="detail">Business services to Assets and impact via context and BIA. Assets and impact to Risk scenarios via dependencies. Risk scenarios to Control gaps via current risk. Control gaps to Treatment and review via residual decision. Treatment and review to Assets and impact via reassessment.</desc>
